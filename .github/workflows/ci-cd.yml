# This is the name of the consolidated workflow.
name: CI & CD Pipeline

# Triggers the workflow on push or pull request events but only for the "main" branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Lints the code, verifies the application builds, and runs unit tests.
  lint-build-and-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    continue-on-error: true 
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Generate code
        run: go generate ./...

      - name: Lint code
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout 10m0s -v

      - name: Build application
        run: go build -v ./...

      - name: Run unit tests
        run: go test -count=1 -benchtime=1x ./...

  # JOB 2: Runs security scans for vulnerable dependencies (SCA) and secrets (SAST).
  security-scans:
    name: Security Scans (SCA & SAST)
    runs-on: ubuntu-latest
    continue-on-error: true 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Software Component Analysis (SCA)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      - name: Static Application Security Testing (SAST) with Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # JOB 3: Performs in-depth static analysis with CodeQL.
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true 
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Build application for CodeQL
        env:
          CGO_ENABLED: '1'
        run: |
          go generate ./...
          go build -v ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language/go"

  # JOB 4: Builds, pushes the Docker image, and updates the Kubernetes manifest.
  build-push-and-update-manifest:
    name: Build, Push & Update Manifest
    runs-on: ubuntu-latest
    needs: [lint-build-and-test, security-scans, codeql-analysis]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # Add permissions to allow committing back to the repository.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ollama:${{ github.sha }}

      - name: Update deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/ollama:${{ github.sha }}|g" kubernetes/04-ollama-statefulset.yml

      - name: Commit and push manifest changes
        # ADDED: This step commits the updated manifest file back to your main branch.
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add kubernetes/04-ollama-statefulset.yml # Verify this path is correct
          git diff --staged --quiet || git commit -m "CI: Update image tag to ${{ github.sha }}"
          git push