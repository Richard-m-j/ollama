run:
  timeout: 5m
linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - gocheckcompilerdirectives
    - gofmt
    - gofumpt
    - gosec # Enable the gosec linter
    - gosimple
    - govet
    - ineffassign
    - intrange
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - nosprintfhostport
    - staticcheck
    - unconvert
    - usetesting
    - wastedassign
    - whitespace
  disable:
    - usestdlibvars
    - errcheck
linters-settings:
  staticcheck:
    checks:
      - all
      - -SA1019 # omit Deprecated check
issues:
  exclude-rules:
    # Ignore G107: Potential HTTP request made with variable URL
    - path: llm/server.go
      linters: [gosec]
      text: "G107"
    # Ignore G302: Use of os.Chmod is discouraged
    - path: server/layer.go
      linters: [gosec]
      text: "G302"
    # Ignore G404: Use of weak random number generator is acceptable for backoff jitter
    - path: server/internal/internal/backoff/backoff.go
      linters: [gosec]
      text: "G404"
    # Ignore G115: Integer overflow conversions are deemed safe in this context
    - path: fs/gguf/
      linters: [gosec]
      text: "G115"
severity:
  default-severity: error
  rules:
    - linters:
        - gofmt
        - goimports
        - intrange
      severity: info